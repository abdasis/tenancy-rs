name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --features postgres,axum,encryption,impersonation,testing -- -D warnings
      - run: cargo test
      - run: cargo test --all-features
      - run: cargo check --no-default-features
      - run: cargo doc --no-deps
      - run: cargo build --examples --features axum
