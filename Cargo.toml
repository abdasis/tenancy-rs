[package]
name = "tenancy"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Multi-tenant primitives for Rust services: resolution, lifecycle, bootstrappers, single-DB scoping and multi-DB support"
publish = false

[[example]]
name = "axum_single_db"
required-features = ["axum"]

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt", "macros", "time", "fs"] }
tracing = "0.1"

sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "json", "macros", "migrate"], optional = true }
axum = { version = "0.8", optional = true }
tower = { version = "0.5", optional = true }
redis = { version = "0.27", features = ["tokio-comp"], optional = true }
aes-gcm = { version = "0.10", optional = true }
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros", "net", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[features]
default = []
axum = ["dep:axum", "dep:tower"]
postgres = ["dep:sqlx"]
postgres-rls = ["postgres"]
redis = ["dep:redis"]
encryption = ["dep:aes-gcm", "dep:hex"]
impersonation = ["dep:hmac", "dep:sha2", "dep:hex"]
testing = []
